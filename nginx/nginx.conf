events {}

http {
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream gateway {
        zone gateway 64k;
        server gateway:8080 resolve;
    }
    upstream landing { zone landing 64k; server landing:80 resolve; }
    upstream store { zone store 64k; server store:80 resolve; }
    upstream admin { zone admin 64k; server admin:80 resolve; }

    server {
        listen 80;

        client_max_body_size 1m;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location = /store { return 308 /store/; }
        location = /admin { return 308 /admin/; }
        location /store/ { proxy_pass http://store; }
        location /admin/ { proxy_pass http://admin; }
        location /api/fixture-media-upload/ {
            client_max_body_size 5m;
            limit_except PUT { deny all; }
            proxy_pass http://gateway/fixture-media-upload/;
            add_header Cache-Control "no-store" always;
        }
        location /api/ {
            proxy_pass http://gateway/;
            proxy_http_version 1.1;
            add_header Cache-Control "no-store" always;
        }
        location ~ ^/(auth|accounts|products|orders|exchange)(/|$) {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            add_header Cache-Control "no-store" always;
        }
        location / { proxy_pass http://landing; }
    }
}
