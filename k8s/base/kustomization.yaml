apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform
resources:
  - namespace-config.yaml
  - account.yaml
  - auth.yaml
  - order.yaml
  - gateway.yaml
  - product.yaml
  - exchange.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
patches:
  - path: otel-instrumentation.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: "gateway|auth|account|order|product"
