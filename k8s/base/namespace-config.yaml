apiVersion: v1
kind: Namespace
metadata:
  name: platform
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: platform
data:
  LOG_LEVEL: info
  ACCOUNT_URL: http://account:8080
  AUTH_URL: http://auth:8080
  ORDER_URL: http://order:8080
  PRODUCT_URL: http://product:8080
  EXCHANGE_URL: http://exchange:8080
  CACHE_REDIS_URL: redis://redis:6379
  CACHE_ENABLED: "false"
  CACHE_TTL_SECONDS: "60"
  ACCESS_TOKEN_EXPIRATION_SECONDS: "900"
  SESSION_COOKIE_SECURE: "true"
  SESSION_COOKIE_PATH: /api
  PRODUCT_IMAGE_MODE: s3
  PRODUCT_IMAGE_S3_BUCKET: replace-with-product-media-bucket
  PRODUCT_IMAGE_S3_REGION: us-east-1
  PRODUCT_IMAGE_S3_MEDIA_ORIGIN: https://replace-with-cloudfront-domain
  EXCHANGE_PROVIDER_URL: http://exchange-mock:8080
  EXCHANGE_PROVIDER_REQUIRES_API_KEY: "false"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: product
  namespace: platform
