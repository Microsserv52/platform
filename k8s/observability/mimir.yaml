apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mimir-data
  namespace: observability
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: gp3
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mimir
  namespace: observability
  labels:
    app.kubernetes.io/name: mimir
    app.kubernetes.io/part-of: platform-observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mimir
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mimir
        app.kubernetes.io/part-of: platform-observability
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mimir
          image: grafana/mimir:3.2.6
          imagePullPolicy: IfNotPresent
          args:
            - -config.file=/etc/mimir/config.yml
            - -target=all
          ports:
            - name: http
              containerPort: 9009
            - name: grpc
              containerPort: 9095
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/mimir
              readOnly: true
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: config
          configMap:
            name: mimir-config
        - name: data
          persistentVolumeClaim:
            claimName: mimir-data
---
apiVersion: v1
kind: Service
metadata:
  name: mimir
  namespace: observability
  labels:
    app.kubernetes.io/name: mimir
    app.kubernetes.io/part-of: platform-observability
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mimir
  ports:
    - name: http
      port: 9009
      targetPort: http
    - name: grpc
      port: 9095
      targetPort: grpc
