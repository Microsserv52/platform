# Example only. Requires External Secrets Operator with an IRSA role that can
# read platform/grafana/* from AWS Secrets Manager. The secret value is created
# out of band; it never enters Git, Helm values or Terraform state.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-password
      remoteRef:
        key: platform/grafana/admin
        property: password
    - secretKey: admin-user
      remoteRef:
        key: platform/grafana/admin
        property: username
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-alerting
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: grafana-alerting
    creationPolicy: Owner
  data:
    - secretKey: email-to
      remoteRef:
        key: platform/grafana/alerting
        property: email-to
