apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-observability-scrape
  namespace: platform
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["gateway", "auth", "account", "order", "product", "exchange"]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 8080
