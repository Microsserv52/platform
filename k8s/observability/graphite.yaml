apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: graphite-data
  namespace: observability
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: gp3
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphite
  namespace: observability
  labels:
    app.kubernetes.io/name: graphite
    app.kubernetes.io/part-of: platform-observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: graphite
  template:
    metadata:
      labels:
        app.kubernetes.io/name: graphite
        app.kubernetes.io/part-of: platform-observability
    spec:
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: graphite
          image: graphiteapp/graphite-statsd:1.1.10-5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
            - name: carbon
              containerPort: 2003
            - name: statsd
              containerPort: 8125
              protocol: UDP
          volumeMounts:
            - name: data
              mountPath: /opt/graphite/storage
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: graphite-data
---
apiVersion: v1
kind: Service
metadata:
  name: graphite
  namespace: observability
  labels:
    app.kubernetes.io/name: graphite
    app.kubernetes.io/part-of: platform-observability
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: graphite
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: carbon
      port: 2003
      targetPort: carbon
    - name: statsd
      port: 8125
      targetPort: statsd
      protocol: UDP
