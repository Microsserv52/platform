apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability

resources:
  - ../../../observability

labels:
  - pairs:
      app.kubernetes.io/environment: staging
    includeSelectors: false

patches:
  - target:
      group: monitoring.coreos.com
      version: v1
      kind: Probe
      name: platform-edge
    patch: |-
      $patch: delete
      apiVersion: monitoring.coreos.com/v1
      kind: Probe
      metadata:
        name: platform-edge
