apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability

resources:
  - ../../../observability

labels:
  - pairs:
      app.kubernetes.io/environment: staging
    includeSelectors: false

patches:
  - target:
      kind: ConfigMap
      name: grafana-config
    patch: |-
      - op: replace
        path: /data/root-url
        value: http://localhost:3000
      - op: replace
        path: /data/enforce-domain
        value: "false"
      - op: replace
        path: /data/cookie-secure
        value: "false"
  - target:
      group: monitoring.coreos.com
      version: v1
      kind: Probe
      name: platform-edge
    patch: |-
      $patch: delete
      apiVersion: monitoring.coreos.com/v1
      kind: Probe
      metadata:
        name: platform-edge
