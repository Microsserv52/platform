apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform
resources:
  - ../../base
  - database.yaml
  - redis.yaml
  - image-storage.yaml

patches:
  - target:
      kind: ConfigMap
      name: platform-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: platform-config
      data:
        SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/platform
        SPRING_DATASOURCE_USERNAME: admin
        CACHE_REDIS_URL: redis://redis:6379
        PRODUCT_IMAGE_MODE: mock
        PRODUCT_IMAGE_STORAGE_URL: http://image-storage:8090
