apiVersion: v1
kind: Service
metadata:
  name: image-storage
  namespace: platform
spec:
  selector:
    app: image-storage
  ports:
    - port: 8090
      targetPort: 8090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-storage
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: image-storage
  template:
    metadata:
      labels:
        app: image-storage
    spec:
      containers:
        - name: image-storage
          image: microsserv52-image-storage:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8090
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
