[agent]
  interval = "30s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = ""
  omit_hostname = false

[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  timeout = "5s"
  container_state_include = ["running"]
  total_include = ["cpu", "blkio", "network"]
  docker_label_include = ["com.docker.compose.service"]
  docker_label_exclude = []
  tag_env = []
  [inputs.docker.tags]
    environment = "local"

[[processors.rename]]
  [[processors.rename.replace]]
    tag = "container_name"
    dest = "host"

[[outputs.graphite]]
  servers = ["graphite:2003"]
  prefix = "platform"
  template = "host.measurement.field"
  timeout = 10
