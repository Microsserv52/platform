[agent]
  interval = "30s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = ""
  omit_hostname = false

[[inputs.kubernetes]]
  url = "https://${HOST_IP}:10250"
  bearer_token = "/var/run/secrets/kubernetes.io/serviceaccount/token"
  insecure_skip_verify = true
  response_timeout = "10s"
  label_include = ["app"]
  [inputs.kubernetes.tagpass]
    namespace = ["platform"]

[[processors.rename]]
  [[processors.rename.replace]]
    tag = "pod_name"
    dest = "host"

[[outputs.graphite]]
  servers = ["graphite.observability.svc.cluster.local:2003"]
  prefix = "platform"
  template = "host.measurement.field"
  timeout = 10
