apiVersion: 1

groups:
  - orgId: 1
    name: platform-slo
    folder: Platform Alerts
    interval: 1m
    rules:
      - uid: platform-availability-fast-burn
        title: Platform availability fast burn
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: platform:availability:ratio5m
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.99
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "Service {{ $labels.service }} availability is below 99% for 5 minutes."
          description: "Error budget is burning faster than the 99.5% SLO allows."
          runbook_url: "https://microsserv52.github.io/platform/operations/observability/#alert-runbook"
        labels:
          severity: page
          owner: platform

      - uid: platform-availability-slow-burn
        title: Platform availability slow burn
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: platform:availability:ratio5m
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.995
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 30m
        annotations:
          summary: "Service {{ $labels.service }} is consuming error budget above the 99.5% SLO."
          runbook_url: "https://microsserv52.github.io/platform/operations/observability/#alert-runbook"
        labels:
          severity: ticket
          owner: platform

      - uid: platform-latency-p95
        title: Platform p95 latency above 1s
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: platform:latency:p95_5m
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 10m
        annotations:
          summary: "Service {{ $labels.service }} p95 latency is above the 1s ticket threshold."
          runbook_url: "https://microsserv52.github.io/platform/operations/observability/#alert-runbook"
        labels:
          severity: ticket
          owner: platform

      - uid: platform-target-down
        title: Platform scrape target down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: up{job=~"gateway|auth|account|order|product|exchange"} == 0
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 2m
        annotations:
          summary: "Prometheus cannot scrape {{ $labels.job }}."
          runbook_url: "https://microsserv52.github.io/platform/operations/observability/#alert-runbook"
        labels:
          severity: page
          owner: platform

      - uid: platform-synthetic-failure
        title: Synthetic edge probe failing
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: probe_success == 0
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 2m
        annotations:
          summary: "Synthetic probe failed for {{ $labels.instance }}."
          runbook_url: "https://microsserv52.github.io/platform/operations/observability/#alert-runbook"
        labels:
          severity: page
          owner: platform
          service: edge

      - uid: platform-hikari-saturation
        title: Database connection pool saturation
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: platform:hikari:utilization
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.9
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "Hikari pool on {{ $labels.service }} is above 90% utilization."
          runbook_url: "https://microsserv52.github.io/platform/operations/observability/#alert-runbook"
        labels:
          severity: ticket
          owner: platform

      - uid: platform-exchange-provider-errors
        title: Exchange provider errors
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: sum by (service) (rate(exchange_provider_errors_total[5m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.1
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "Exchange provider error rate is above 0.1/s."
          runbook_url: "https://microsserv52.github.io/platform/operations/observability/#alert-runbook"
        labels:
          severity: page
          owner: platform
          service: exchange

      - uid: platform-cache-errors
        title: Product cache errors
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: sum by (service) (rate(product_cache_errors_total[5m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 10m
        annotations:
          summary: "Product cache errors are increasing."
          runbook_url: "https://microsserv52.github.io/platform/operations/observability/#alert-runbook"
        labels:
          severity: ticket
          owner: platform
          service: product

      - uid: graphite-pod-cpu-high
        title: Pod CPU above 70%
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: graphite
            model:
              refId: A
              target: "aliasByNode(removeBelowValue(platform.*.docker_container_cpu.usage_percent, 70), 1)"
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: "A container is above 70% CPU for 10 minutes."
          runbook_url: "https://microsserv52.github.io/platform/operations/observability/#alert-runbook"
        labels:
          severity: warning
          owner: platform

      - uid: graphite-pod-memory-high
        title: Pod memory above 80%
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: graphite
            model:
              refId: A
              target: "aliasByNode(removeBelowValue(platform.*.docker_container_mem.usage_percent, 80), 1)"
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: "A container is above 80% memory for 10 minutes."
          runbook_url: "https://microsserv52.github.io/platform/operations/observability/#alert-runbook"
        labels:
          severity: warning
          owner: platform

      - uid: trace-graph-failures
        title: Cross-service trace failures
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: sum by (client, server) (rate(traces_service_graph_request_failed_total[5m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: "Traces show failing calls between {{ $labels.client }} and {{ $labels.server }}."
          runbook_url: "https://microsserv52.github.io/platform/operations/observability/#alert-runbook"
        labels:
          severity: ticket
          owner: platform

      - uid: trace-span-latency-p95
        title: Cross-service trace p95 above 1s
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: histogram_quantile(0.95, sum by (le, service_name) (rate(traces_spanmetrics_latency_bucket[5m])))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 10m
        annotations:
          summary: "{{ $labels.service_name }} span p95 latency is above 1s."
          runbook_url: "https://microsserv52.github.io/platform/operations/observability/#alert-runbook"
        labels:
          severity: ticket
          owner: platform
