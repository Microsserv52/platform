apiVersion: 1

contactPoints:
  - orgId: 1
    name: platform-email
    receivers:
      - uid: platform-email
        type: email
        disableResolveMessage: false
        settings:
          addresses: $ALERT_EMAIL_TO
          singleEmail: true

policies:
  - orgId: 1
    receiver: platform-email
    group_by: ["alertname", "service", "severity"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: platform-email
        object_matchers:
          - ["severity", "=", "page"]
        group_wait: 10s
        repeat_interval: 1h
        continue: false
