groups:
  - name: platform-sli
    interval: 30s
    rules:
      - record: platform:http_requests:rate5m
        expr: |
          sum by (service) (
            rate(http_server_requests_seconds_count{service!="",uri!~"/actuator.*"}[5m])
          )
          or
          sum by (service) (
            rate(exchange_http_requests_total{service="exchange"}[5m])
          )

      - record: platform:http_errors:rate5m
        expr: |
          (
            sum by (service) (
              rate(http_server_requests_seconds_count{service!="",uri!~"/actuator.*",status=~"5.."}[5m])
            )
            or
            sum by (service) (
              rate(exchange_http_requests_total{service="exchange",status=~"5.."}[5m])
            )
          )
          or
          0 * (
            sum by (service) (
              rate(http_server_requests_seconds_count{service!="",uri!~"/actuator.*"}[5m])
            )
            or
            sum by (service) (
              rate(exchange_http_requests_total{service="exchange"}[5m])
            )
          )

      - record: platform:availability:ratio5m
        expr: |
          (
            (1 - (platform:http_errors:rate5m / platform:http_requests:rate5m))
            and
            (platform:http_requests:rate5m > 0)
          )
          or
          (platform:http_requests:rate5m == bool 0)
          or
          (sum by (service) (up{job=~"gateway|auth|account|order|product|exchange"}) * 0 + 1)

      - record: platform:latency:p95_5m
        expr: |
          histogram_quantile(
            0.95,
            sum by (service, le) (
              rate(http_server_requests_seconds_bucket{service!="",uri!~"/actuator.*"}[5m])
            )
          )
          or
          histogram_quantile(
            0.95,
            sum by (service, le) (
              rate(exchange_http_request_duration_seconds_bucket{service="exchange"}[5m])
            )
          )

      - record: platform:latency:p99_5m
        expr: |
          histogram_quantile(
            0.99,
            sum by (service, le) (
              rate(http_server_requests_seconds_bucket{service!="",uri!~"/actuator.*"}[5m])
            )
          )
          or
          histogram_quantile(
            0.99,
            sum by (service, le) (
              rate(exchange_http_request_duration_seconds_bucket{service="exchange"}[5m])
            )
          )

      - record: platform:error_budget:burn_rate5m
        expr: |
          (1 - platform:availability:ratio5m) / 0.005

      - record: platform:error_budget:burn_rate1h
        expr: |
          (
            1 - (
              (
                sum by (service) (
                  rate(http_server_requests_seconds_count{service!="",uri!~"/actuator.*",status!~"5.."}[1h])
                )
                or
                sum by (service) (
                  rate(exchange_http_requests_total{service="exchange",status!~"5.."}[1h])
                )
              )
              /
              (
                sum by (service) (
                  rate(http_server_requests_seconds_count{service!="",uri!~"/actuator.*"}[1h])
                )
                or
                sum by (service) (
                  rate(exchange_http_requests_total{service="exchange"}[1h])
                )
              )
            )
          )
          /
          0.005

      - record: platform:http_requests:increase28d
        expr: |
          sum by (service) (
            increase(http_server_requests_seconds_count{service!="",uri!~"/actuator.*"}[28d])
          )
          or
          sum by (service) (
            increase(exchange_http_requests_total{service="exchange"}[28d])
          )

      - record: platform:http_errors:increase28d
        expr: |
          (
            sum by (service) (
              increase(http_server_requests_seconds_count{service!="",uri!~"/actuator.*",status=~"5.."}[28d])
            )
            or
            sum by (service) (
              increase(exchange_http_requests_total{service="exchange",status=~"5.."}[28d])
            )
          )
          or
          0 * (
            sum by (service) (
              increase(http_server_requests_seconds_count{service!="",uri!~"/actuator.*"}[28d])
            )
            or
            sum by (service) (
              increase(exchange_http_requests_total{service="exchange"}[28d])
            )
          )

      - record: platform:availability:ratio28d
        expr: |
          (
            (1 - (platform:http_errors:increase28d / platform:http_requests:increase28d))
            and
            (platform:http_requests:increase28d > 0)
          )
          or
          (platform:http_requests:increase28d == bool 0)
          or
          (sum by (service) (up{job=~"gateway|auth|account|order|product|exchange"}) * 0 + 1)

      - record: platform:error_budget:remaining28d
        expr: |
          clamp_min(1 - ((1 - platform:availability:ratio28d) / 0.005), 0)

      - record: platform:jvm_heap:ratio
        expr: |
          sum by (service) (jvm_memory_used_bytes{area="heap",service!=""})
          /
          sum by (service) (jvm_memory_max_bytes{area="heap",service!=""})

      - record: platform:hikari:utilization
        expr: |
          sum by (service) (hikaricp_connections_active{service!=""})
          /
          sum by (service) (hikaricp_connections_max{service!=""})
