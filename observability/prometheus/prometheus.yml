global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local
    platform: microsserv52

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway:8080"]
        labels:
          service: gateway

  - job_name: auth
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["auth:8080"]
        labels:
          service: auth

  - job_name: account
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["account:8080"]
        labels:
          service: account

  - job_name: order
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["order:8080"]
        labels:
          service: order

  - job_name: product
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["product:8080"]
        labels:
          service: product

  - job_name: exchange
    metrics_path: /metrics
    static_configs:
      - targets: ["exchange:8080"]
        labels:
          service: exchange

  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://nginx/
          - http://nginx/store/
          - http://nginx/admin/
          - http://nginx/api/products
          - http://nginx/api/actuator/health
        labels:
          service: edge
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
