name: microsserv52-frontend-demo

services:
  landing:
    build:
      context: ./web/landing
      args:
        NEXT_PUBLIC_APP_ENV: fixture
  store:
    build:
      context: ./web/store
      args:
        NEXT_PUBLIC_APP_ENV: fixture
  admin:
    build:
      context: ./web/admin
      args:
        NEXT_PUBLIC_APP_ENV: fixture
  gateway:
    image: python:3.13-slim
    command:
      [
        "python",
        "/qa/serve.py",
        "--host",
        "0.0.0.0",
        "--port",
        "8080",
        "--fixtures",
        "--api-only",
      ]
    volumes:
      - ./tests/frontend:/qa:ro
  nginx:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${FRONTEND_DEMO_PORT:-8081}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - landing
      - store
      - admin
      - gateway
