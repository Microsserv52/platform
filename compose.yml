name: platform

services:
  database:
    image: Microsserv52-postgres:latest
    hostname: database
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=platform

  product:
    image: Microsserv52-product:latest
    hostname: product
    environment:
      - LOG_LEVEL=info
    deploy:
      replicas: 3
    depends_on:
      - database

  order:
    image: ${ORDER_IMAGE:-ghcr.io/microsserv52/order-service:latest}
    hostname: order
    environment:
      - LOG_LEVEL=info
    deploy:
      replicas: 3
    depends_on:
      - database
      - product

  exchange:
    image: Microsserv52-exchange:latest
    hostname: exchange
    environment:
      - LOG_LEVEL=info
    deploy:
      replicas: 3

  account:
    image: ${ACCOUNT_IMAGE:-ghcr.io/microsserv52/account:latest}
    hostname: account
    environment:
      - LOG_LEVEL=info
      - JWT_SECRET=${JWT_SECRET:-change-me-in-development-use-a-long-random-secret}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-change-me-in-development}
    deploy:
      replicas: 3
    depends_on:
      - database

  auth:
    image: ${AUTH_IMAGE:-ghcr.io/microsserv52/auth:latest}
    hostname: auth
    environment:
      - LOG_LEVEL=info
      - JWT_SECRET=${JWT_SECRET:-change-me-in-development-use-a-long-random-secret}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-change-me-in-development}
    deploy:
      replicas: 3
    depends_on:
      - database
      - account

  gateway:
    image: ${GATEWAY_IMAGE:-ghcr.io/microsserv52/gateway:latest}
    hostname: gateway
    environment:
      - LOG_LEVEL=info
      - JWT_SECRET=${JWT_SECRET:-change-me-in-development-use-a-long-random-secret}
      - SESSION_COOKIE_SECURE=false
      - SESSION_COOKIE_PATH=/api
    deploy:
      replicas: 3
    depends_on:
      - account
      - auth

  landing:
    image: microsserv52-landing:local
    build:
      context: ./web/landing
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
        NEXT_PUBLIC_DISPLAY_TIME_ZONE: ${DISPLAY_TIME_ZONE:-UTC}
    hostname: landing

  store:
    image: microsserv52-store:local
    build:
      context: ./web/store
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
        NEXT_PUBLIC_DISPLAY_TIME_ZONE: ${DISPLAY_TIME_ZONE:-UTC}
    hostname: store

  admin:
    image: microsserv52-admin:local
    build:
      context: ./web/admin
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
        NEXT_PUBLIC_DISPLAY_TIME_ZONE: ${DISPLAY_TIME_ZONE:-UTC}
    hostname: admin

  nginx:
    image: nginx:1.28-alpine
    hostname: nginx
    ports:
      - 8080:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway
      - landing
      - store
      - admin
