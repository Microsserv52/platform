name: platform

services:
  database:
    image: postgres:latest
    hostname: database
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=platform

  product:
    image: ${PRODUCT_IMAGE:-microsserv52-product:latest}
    hostname: product
    environment:
      - LOG_LEVEL=info
    deploy:
      replicas: 3
    depends_on:
      - database

  order:
    image: ${ORDER_IMAGE:-ghcr.io/microsserv52/order-service:latest}
    build:
      context: .
      dockerfile: api/order-service/Dockerfile
    hostname: order
    environment:
      - LOG_LEVEL=info
    deploy:
      replicas: 3
    depends_on:
      - database
      - product

  exchange:
    image: ${EXCHANGE_IMAGE:-microsserv52-exchange:latest}
    hostname: exchange
    environment:
      - LOG_LEVEL=info
    deploy:
      replicas: 3

  account:
    image: ${ACCOUNT_IMAGE:-ghcr.io/microsserv52/account:latest}
    build:
      context: ./api/account
    hostname: account
    environment:
      - LOG_LEVEL=info
      - JWT_SECRET=${JWT_SECRET:-change-me-in-development-use-a-long-random-secret}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-change-me-in-development}
    deploy:
      replicas: 3
    depends_on:
      - database

  auth:
    image: ${AUTH_IMAGE:-ghcr.io/microsserv52/auth:latest}
    build:
      context: ./api/auth
    hostname: auth
    environment:
      - LOG_LEVEL=info
      - JWT_SECRET=${JWT_SECRET:-change-me-in-development-use-a-long-random-secret}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-change-me-in-development}
    deploy:
      replicas: 3
    depends_on:
      - database
      - account

  gateway:
    image: ${GATEWAY_IMAGE:-ghcr.io/microsserv52/gateway:latest}
    build:
      context: ./api/gateway
    hostname: gateway
    environment:
      - LOG_LEVEL=info
      - JWT_SECRET=${JWT_SECRET:-change-me-in-development-use-a-long-random-secret}
    deploy:
      replicas: 3
    depends_on:
      - account
      - auth

  nginx:
    image: nginx:alpine
    hostname: nginx
    ports:
      - 8080:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway
