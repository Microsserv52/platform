name: platform

services:
  database:
    image: Microsserv52-postgres:latest
    hostname: database
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=platform

  product:
    image: Microsserv52-product:latest
    hostname: product
    environment:
      - LOG_LEVEL=info
    deploy:
      replicas: 3
    depends_on:
      - database

  order:
    build:
      context: .
      dockerfile: api/order-service/Dockerfile
    image: Microsserv52-order:latest
    hostname: order
    environment:
      - LOG_LEVEL=info
    deploy:
      replicas: 3
    depends_on:
      - database
      - product

  exchange:
    image: Microsserv52-exchange:latest
    hostname: exchange
    environment:
      - LOG_LEVEL=info
    deploy:
      replicas: 3

  account:
    build:
      context: ./api/account
    image: Microsserv52-account:latest
    hostname: account
    environment:
      - LOG_LEVEL=info
      - JWT_SECRET=${JWT_SECRET:-change-me-in-development-use-a-long-random-secret}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-change-me-in-development}
    deploy:
      replicas: 3
    depends_on:
      - database

  auth:
    build:
      context: ./api/auth
    image: Microsserv52-auth:latest
    hostname: auth
    environment:
      - LOG_LEVEL=info
      - JWT_SECRET=${JWT_SECRET:-change-me-in-development-use-a-long-random-secret}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-change-me-in-development}
    deploy:
      replicas: 3
    depends_on:
      - database
      - account

  gateway:
    build:
      context: ./api/gateway
    image: Microsserv52-gateway:latest
    hostname: gateway
    environment:
      - LOG_LEVEL=info
      - JWT_SECRET=${JWT_SECRET:-change-me-in-development-use-a-long-random-secret}
    deploy:
      replicas: 3
    depends_on:
      - account
      - auth

  nginx:
    image: nginx:alpine
    hostname: nginx
    ports:
      - 8080:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway
