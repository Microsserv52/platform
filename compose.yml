name: platform

services:
  database:
    image: postgres:17-alpine
    hostname: database
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin}
      - POSTGRES_DB=${POSTGRES_DB:-platform}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    hostname: redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  product:
    image: ${PRODUCT_IMAGE:-microsserv52-product:local}
    build:
      context: ./api/product
      dockerfile: Dockerfile
    hostname: product
    environment:
      - LOG_LEVEL=info
      # Product requires an explicit datasource and JWT secret in the prod
      # profile. It shares the platform PostgreSQL container; Flyway creates
      # its tables on first startup. Point these at a dedicated database if
      # you do not want it sharing the platform schema.
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/${POSTGRES_DB:-platform}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-admin}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-admin}
      # Must match the platform-wide secret used by Gateway, Auth, Account and Order.
      - JWT_SECRET=${JWT_SECRET:-change-me-in-development-use-a-long-random-secret}
      # The platform schema is shared with JPA ddl-auto services, so Flyway must
      # baseline it before applying its own migrations.
      - SPRING_FLYWAY_BASELINE_ON_MIGRATE=true
      - SPRING_FLYWAY_BASELINE_VERSION=0
      - CACHE_REDIS_URL=${CACHE_REDIS_URL:-redis://redis:6379}
      - CACHE_ENABLED=${CACHE_ENABLED:-false}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-60}
      # Local blob-storage mock; production deployments use PRODUCT_IMAGE_MODE=s3.
      - PRODUCT_IMAGE_MODE=${PRODUCT_IMAGE_MODE:-mock}
      - PRODUCT_IMAGE_STORAGE_URL=${PRODUCT_IMAGE_STORAGE_URL:-http://image-storage:8090}
    deploy:
      replicas: 3
    depends_on:
      database:
        condition: service_healthy
      image-storage:
        condition: service_healthy
      redis:
        condition: service_healthy

  order:
    image: ${ORDER_IMAGE:-microsserv52-order:local}
    build:
      context: ./api
      dockerfile: order-service/Dockerfile
    hostname: order
    environment:
      - LOG_LEVEL=info
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/${POSTGRES_DB:-platform}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-admin}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-admin}
      - PRODUCT_URL=http://product:8080
      - JWT_SECRET=${JWT_SECRET:-change-me-in-development-use-a-long-random-secret}
      - CACHE_REDIS_URL=${CACHE_REDIS_URL:-redis://redis:6379}
    deploy:
      replicas: 3
    depends_on:
      database:
        condition: service_healthy
      product:
        condition: service_started
      redis:
        condition: service_healthy

  exchange:
    image: ${EXCHANGE_IMAGE:-microsserv52-exchange:local}
    build:
      context: ./api/exchange/
      dockerfile: Dockerfile
    hostname: exchange
    environment:
      - LOG_LEVEL=info
      - EXCHANGE_PROVIDER_URL=${EXCHANGE_PROVIDER_URL:-http://exchange-provider-mock:8080}
      - EXCHANGE_PROVIDER_API_KEY=${EXCHANGE_PROVIDER_API_KEY:-local-development}
      - CACHE_REDIS_URL=${CACHE_REDIS_URL:-redis://redis:6379}
      # Required, no default. Must match the platform-wide secret used by
      # Gateway, Auth, Account, Order and Product.
      - JWT_SECRET=${JWT_SECRET:-change-me-in-development-use-a-long-random-secret}
    deploy:
      replicas: 3
    depends_on:
      exchange-provider-mock:
        condition: service_healthy
      redis:
        condition: service_healthy

  image-storage:
    build:
      context: ./mocks/image-storage
      dockerfile: Dockerfile
    hostname: image-storage
    volumes:
      - image-storage-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  exchange-provider-mock:
    build:
      context: ./mocks/exchange-provider/
      dockerfile: Dockerfile
    hostname: exchange-provider-mock
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  account:
    image: ${ACCOUNT_IMAGE:-microsserv52-account:local}
    build:
      context: ./api/account
      dockerfile: Dockerfile
    hostname: account
    environment:
      - LOG_LEVEL=info
      - JWT_SECRET=${JWT_SECRET:-change-me-in-development-use-a-long-random-secret}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-change-me-in-development}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/${POSTGRES_DB:-platform}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-admin}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-admin}
      - CACHE_REDIS_URL=${CACHE_REDIS_URL:-redis://redis:6379}
      # LOCAL-ONLY admin bootstrap: seed/promote this account as ROLE_ADMIN on
      # startup. Defaults make local Compose usable out of the box. The
      # bootstrap refuses to run when ENV/APP_ENV/SPRING_PROFILES_ACTIVE marks
      # production, and setting both vars empty disables it entirely.
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@microsserv52.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-1berto52}
    deploy:
      replicas: 3
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  auth:
    image: ${AUTH_IMAGE:-microsserv52-auth:local}
    build:
      context: ./api/auth
      dockerfile: Dockerfile
    hostname: auth
    environment:
      - LOG_LEVEL=info
      - JWT_SECRET=${JWT_SECRET:-change-me-in-development-use-a-long-random-secret}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-change-me-in-development}
      - ACCESS_TOKEN_EXPIRATION_SECONDS=${ACCESS_TOKEN_EXPIRATION_SECONDS:-900}
      - CACHE_REDIS_URL=${CACHE_REDIS_URL:-redis://redis:6379}
    deploy:
      replicas: 3
    depends_on:
      - database
      - account

  gateway:
    image: ${GATEWAY_IMAGE:-microsserv52-gateway:local}
    build:
      context: ./api/gateway
      dockerfile: Dockerfile
    hostname: gateway
    environment:
      - LOG_LEVEL=info
      - JWT_SECRET=${JWT_SECRET:-change-me-in-development-use-a-long-random-secret}
      - AUTH_URL=http://auth:8080
      - ACCOUNT_URL=http://account:8080
      - ORDER_URL=http://order:8080
      - PRODUCT_URL=http://product:8080
      - EXCHANGE_URL=http://exchange:8080
      - SESSION_COOKIE_SECURE=false
      - SESSION_COOKIE_PATH=/api
      - CACHE_REDIS_URL=${CACHE_REDIS_URL:-redis://redis:6379}
    deploy:
      replicas: 3
    depends_on:
      - account
      - auth
      - redis

  landing:
    image: microsserv52-landing:local
    build:
      context: ./web/landing/
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
        NEXT_PUBLIC_DISPLAY_TIME_ZONE: ${DISPLAY_TIME_ZONE:-UTC}
    hostname: landing

  store:
    image: microsserv52-store:local
    build:
      context: ./web/store/
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
        NEXT_PUBLIC_DISPLAY_TIME_ZONE: ${DISPLAY_TIME_ZONE:-UTC}
    hostname: store

  admin:
    image: microsserv52-admin:local
    build:
      context: ./web/admin/
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
        NEXT_PUBLIC_DISPLAY_TIME_ZONE: ${DISPLAY_TIME_ZONE:-UTC}
    hostname: admin

  nginx:
    image: nginx:1.28-alpine
    hostname: nginx
    ports:
      - 8080:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway
      - landing
      - store
      - admin

  demo-seeder:
    image: python:3.13-alpine
    hostname: demo-seeder
    profiles: ["demo"]
    volumes:
      - ./scripts:/qa:ro
    environment:
      - DEMO_BASE_URL=http://nginx/api
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@microsserv52.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-1berto52}
    command: ["python", "/qa/seed_demo.py"]
    depends_on:
      nginx:
        condition: service_started
      product:
        condition: service_healthy
      order:
        condition: service_started

volumes:
  redis-data:
  image-storage-data:
