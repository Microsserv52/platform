name: Documentation
on:
  push:
    branches:
      - master
      - main
permissions:
  contents: read
  actions: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install zensical
      - run: zensical build --clean
      - name: Remove stale GitHub Pages artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_ids="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
              --jq '.artifacts[] | select(.name == "github-pages") | .id'
          )"
          for artifact_id in $artifact_ids; do
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Wait for GitHub Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            artifact_count="$(
              gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
                --jq '[.artifacts[] | select(.name == "github-pages")] | length'
            )"
            if [[ "$artifact_count" == "1" ]]; then
              echo "GitHub Pages artifact is visible"
              exit 0
            fi
            echo "Waiting for GitHub Pages artifact (${attempt}/12; found ${artifact_count})"
            sleep 5
          done
          echo "GitHub Pages artifact did not become uniquely visible" >&2
          exit 1
      - uses: actions/deploy-pages@v5
        id: deployment
