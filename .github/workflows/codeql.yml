name: CodeQL

on:
  push:
    branches: [main, master, feature/spring-microservices]
  pull_request:
  schedule:
    - cron: '30 3 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, actions]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Checkout backend submodules
        run: >-
          git -c url.https://github.com/.insteadOf=git@github.com: submodule update --init --recursive -- api/account api/auth api/gateway api/order api/order-service
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name: Build Java services for CodeQL
        if: matrix.language == 'java-kotlin'
        run: |
          set -euo pipefail
          (cd api/order && ./mvnw --batch-mode --no-transfer-progress install -DskipTests -Dspring-boot.repackage.skip=true)
          for service in account auth gateway order-service; do
            (cd "api/${service}" && ./mvnw --batch-mode --no-transfer-progress package -DskipTests)
          done
      - uses: github/codeql-action/analyze@v3
