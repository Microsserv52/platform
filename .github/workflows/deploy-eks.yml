name: Deploy to AWS EKS

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify before deployment
        run: |
          for service in account auth gateway order order-service; do
            (cd "api/$service" && ./mvnw --batch-mode --no-transfer-progress verify)
          done
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Build and push images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/account:$TAG" ./api/account
          docker build -t "$REGISTRY/auth:$TAG" ./api/auth
          docker build -t "$REGISTRY/gateway:$TAG" ./api/gateway
          docker build -t "$REGISTRY/order:$TAG" -f api/order-service/Dockerfile .
          docker push "$REGISTRY/account:$TAG"
          docker push "$REGISTRY/auth:$TAG"
          docker push "$REGISTRY/gateway:$TAG"
          docker push "$REGISTRY/order:$TAG"
      - uses: azure/setup-kubectl@v4
      - name: Configure EKS and deploy
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          INTERNAL_SERVICE_SECRET: ${{ secrets.INTERNAL_SERVICE_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          PRODUCT_URL: ${{ vars.PRODUCT_URL }}
          EXCHANGE_URL: ${{ vars.EXCHANGE_URL }}
        run: |
          test -n "$PRODUCT_URL" || { echo "PRODUCT_URL repository variable is required"; exit 1; }
          test -n "$EXCHANGE_URL" || { echo "EXCHANGE_URL repository variable is required"; exit 1; }
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"
          kubectl create namespace platform --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n platform create secret generic platform-secrets \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=INTERNAL_SERVICE_SECRET="$INTERNAL_SERVICE_SECRET" \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --from-literal=SPRING_DATASOURCE_URL="$SPRING_DATASOURCE_URL" \
            --from-literal=SPRING_DATASOURCE_USERNAME="$SPRING_DATASOURCE_USERNAME" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/00-namespace-config.yaml
          kubectl -n platform patch configmap platform-config --type merge \
            -p "{\"data\":{\"PRODUCT_URL\":\"$PRODUCT_URL\",\"EXCHANGE_URL\":\"$EXCHANGE_URL\"}}"
          kubectl apply -f k8s/20-account.yaml
          kubectl apply -f k8s/30-auth.yaml
          kubectl apply -f k8s/40-order.yaml
          kubectl apply -f k8s/50-gateway.yaml
          kubectl apply -f k8s/60-ingress.yaml
          kubectl -n platform set image deployment/account account="$REGISTRY/account:$TAG"
          kubectl -n platform set image deployment/auth auth="$REGISTRY/auth:$TAG"
          kubectl -n platform set image deployment/gateway gateway="$REGISTRY/gateway:$TAG"
          kubectl -n platform set image deployment/order order="$REGISTRY/order:$TAG"
          kubectl -n platform rollout status deployment/account --timeout=180s
          kubectl -n platform rollout status deployment/auth --timeout=180s
          kubectl -n platform rollout status deployment/gateway --timeout=180s
          kubectl -n platform rollout status deployment/order --timeout=180s
