name: Java CI

on:
  pull_request:
  push:
    branches: [main, master, feature/spring-microservices]

permissions:
  contents: read

jobs:
  java:
    name: ${{ matrix.service }} tests and coverage
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [account, auth, gateway, order, order-service]
    defaults:
      run:
        working-directory: api/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install reusable Order contract
        if: matrix.service == 'order-service'
        working-directory: api/order
        run: ./mvnw --batch-mode --no-transfer-progress install -DskipTests
      - name: Run unit tests, integration context tests, and coverage gate
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ${{ matrix.service }}-test-reports
          path: |
            api/${{ matrix.service }}/target/surefire-reports
            api/${{ matrix.service }}/target/site/jacoco

  compose:
    name: Compose integration validation
    runs-on: ubuntu-latest
    needs: java
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Validate Compose topology
        run: docker compose config
      - name: Build application images
        run: |
          docker build -t microsserv52-account:ci ./api/account
          docker build -t microsserv52-auth:ci ./api/auth
          docker build -t microsserv52-gateway:ci ./api/gateway
          docker build -t microsserv52-order:ci -f api/order-service/Dockerfile .
