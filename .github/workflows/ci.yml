name: Java CI

on:
  pull_request:
  push:
    branches: [main, master, feature/spring-microservices]

permissions:
  contents: read
  packages: read

jobs:
  java:
    name: ${{ matrix.service }} tests and coverage
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [account, auth, gateway, order, order-service]
    defaults:
      run:
        working-directory: api/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0
      - name: Checkout backend submodules
        run: >-
          git -c url.https://github.com/.insteadOf=git@github.com: submodule update --init --recursive -- api/account api/auth api/gateway api/order api/order-service
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install reusable Order contract
        if: matrix.service == 'order-service'
        working-directory: api/order
        run: ./mvnw --batch-mode --no-transfer-progress install -DskipTests -Dspring-boot.repackage.skip=true
      - name: Run unit tests, integration context tests, and coverage gate
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ${{ matrix.service }}-test-reports
          path: |
            api/${{ matrix.service }}/target/surefire-reports
            api/${{ matrix.service }}/target/site/jacoco

  compose:
    name: Compose integration validation
    runs-on: ubuntu-latest
    needs: java
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Checkout backend submodules
        run: >-
          git -c url.https://github.com/.insteadOf=git@github.com: submodule update --init --recursive -- api/account api/auth api/gateway api/order api/order-service
      - name: Validate Compose topology
        run: docker compose config
      - name: Build application images
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          pull_or_build() {
            image="$1"
            context="$2"
            dockerfile="$3"
            if docker pull "$image"; then
              echo "Using published image $image"
            elif [ -n "$dockerfile" ]; then
              docker build -t "$image" -f "$dockerfile" "$context"
            else
              docker build -t "$image" "$context"
            fi
          }

          account_sha="$(git -C api/account rev-parse HEAD)"
          auth_sha="$(git -C api/auth rev-parse HEAD)"
          gateway_sha="$(git -C api/gateway rev-parse HEAD)"
          order_sha="$(git -C api/order-service rev-parse HEAD)"
          pull_or_build "ghcr.io/microsserv52/account:sha-${account_sha}" ./api/account ""
          pull_or_build "ghcr.io/microsserv52/auth:sha-${auth_sha}" ./api/auth ""
          pull_or_build "ghcr.io/microsserv52/gateway:sha-${gateway_sha}" ./api/gateway ""
          pull_or_build "ghcr.io/microsserv52/order-service:sha-${order_sha}" . api/order-service/Dockerfile
